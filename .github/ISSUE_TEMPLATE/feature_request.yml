name: ✨ Feature request
description: Propose a new capability or an improvement
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shipments
        - Fleet
        - Warehouse
        - Integrations
        - Platform / infrastructure
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Who benefits and how much
      description: Which users or teams, and roughly how often this matters.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this idea
          required: true
