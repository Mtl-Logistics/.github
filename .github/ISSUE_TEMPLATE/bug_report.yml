name: 🐞 Bug report
description: Something behaves differently from how it should
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill this in as precisely as you can —
        a reproducible bug gets fixed much faster than a described one.

        **Security issue?** Do not use this form. See our [security policy](https://github.com/Mtl-Logistics/.github/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour you observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The behaviour you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the relevant output. It will be formatted as code automatically.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v2.4.1, or commit a1b2c3d"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local development
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Low — cosmetic or minor annoyance"
        - "Medium — feature impaired, workaround exists"
        - "High — feature unusable, no workaround"
        - "Critical — data loss, outage, or security impact"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am not reporting a security vulnerability here
          required: true
