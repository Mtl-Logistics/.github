name: PR hygiene

# ملاحظة: بنستخدم pull_request مش pull_request_target.
# العنوان وأرقام السطور موجودين في الـ event payload في الحالتين،
# و pull_request مابيديش الـ secrets لـ PRs الجاية من fork.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    name: PR title follows Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,100}$'
          if printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "✓ PR title is a valid Conventional Commit"
          else
            echo "✗ Invalid PR title: $TITLE"
            echo ""
            echo "Expected:  type(scope): subject"
            echo "Types:     feat fix docs style refactor perf test build ci chore revert"
            echo "Example:   feat(shipments): add ETA recalculation endpoint"
            echo ""
            echo "The squash-merge commit takes its subject from this title,"
            echo "so it has to be valid on its own."
            exit 1
          fi

  size-check:
    name: PR is a reviewable size
    runs-on: ubuntu-latest
    steps:
      - name: Warn on very large diffs
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          total=$(( ADDITIONS + DELETIONS ))
          echo "Changed lines: $total"
          if [ "$total" -gt 1000 ]; then
            echo "::warning::This PR changes $total lines. Consider splitting it — large PRs get shallow reviews."
          fi
